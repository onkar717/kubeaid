global:
  netpol:
    enabled: false
  mattermost-operator:
    netpol: false

  postgresql:
    enabled: true
    instanceName: mattermost-operator
    instances: 1
    monitoring:
      enablePodMonitor: true
    size: 8Gi
    recover:
      enabled: false
    backups:
      enabled: false
      schedule: "0 2 * * *"
      retentionPolicy: 30d
      provider: aws
      aws:
        enableKube2IAMIntegration: true
    logicalbackup:
      enabled: false
      schedule: "0 2 * * *"
      provider: s3
      retention: "30d"
    resources:
      limits:
        memory: 800Mi
      requests:
        memory: 500Mi
        cpu: 250m
